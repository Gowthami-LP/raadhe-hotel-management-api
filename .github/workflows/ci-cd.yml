name: Raadhe Hotel API CI-CD Pipeline

# Trigger workflow on push and pull requests
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# Default permissions
permissions:
  contents: read

jobs:

  # JOB 1: Code Quality, Testing and Security
  quality-and-test:

    name: Code Quality and Testing

    runs-on: ubuntu-latest

    # MongoDB service for integration tests
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    env:
      MONGODB_URL: mongodb://localhost:27017/
      DATABASE_NAME: raadhe_hotel_test_db
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 30

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Step 4: Check Python formatting
      - name: Check Formatting
        run: |
          ruff format --check app tests

      # Step 5: Python linting
      - name: Run Ruff
        run: |
          ruff check app tests

      # Step 6: Execute unit tests
      - name: Run Pytest
        run: |
          pytest -v

      # Step 7: Python security scan
      - name: Run Bandit
        run: |
          bandit -r app -ll

      # Step 8: Dependency vulnerability scan
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt

      # Step 9: Secret detection
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/path --no-git --redact --exit-code 1

  # JOB 2: Docker Build and Security Scan
  docker-build-and-scan:

    name: Docker Build and Trivy Scan

    runs-on: ubuntu-latest

    needs: quality-and-test

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t raadhe-hotel-api:ci .

      # Step 3: Scan Docker image
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: raadhe-hotel-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
