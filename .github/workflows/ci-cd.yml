name: Raadhe Hotel API CI-CD Pipeline

# Trigger workflow on push and pull requests
on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

# Default permissions
permissions:
  contents: read

jobs:

  # JOB 1: Code Quality, Testing and Security
  quality-and-test:

    name: Code Quality and Testing

    runs-on: ubuntu-latest

    # MongoDB service for integration tests
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

    env:
      MONGODB_URL: mongodb://localhost:27017/
      DATABASE_NAME: raadhe_hotel_test_db
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 30

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Step 4: Check Python formatting
      - name: Check Formatting
        run: |
          ruff format --check app tests

      # Step 5: Python linting
      - name: Run Ruff
        run: |
          ruff check app tests

      # Step 6: Execute unit tests
      - name: Run Pytest
        run: |
          pytest -v

      # Step 7: Python security scan
      - name: Run Bandit
        run: |
          bandit -r app -ll

      # Step 8: Dependency vulnerability scan
      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt

      # Step 9: Secret detection
      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/path --no-git --redact --exit-code 1

  # JOB 2: Docker Build and Security Scan
  docker-build-and-scan:

    name: Docker Build and Trivy Scan

    runs-on: ubuntu-latest

    needs: quality-and-test

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t raadhe-hotel-api:ci .

      # Step 3: Scan Docker image
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: raadhe-hotel-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # JOB 3: Publish Docker Image
  publish-image:

    name: Publish Image to GHCR

    runs-on: ubuntu-latest

    needs: docker-build-and-scan

    # Publish only from main branch push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:

      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Generate Docker image metadata
      - name: Generate Image Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      # Step 4: Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Build and publish image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
